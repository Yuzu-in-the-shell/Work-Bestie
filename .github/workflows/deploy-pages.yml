name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/cat-work-buddy-app-alxqhy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Cache-bust local CSS/JS references
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          sed -i "s#css/style.css#css/style.css?v=${SHA_SHORT}#" index.html
          sed -i "s#js/stats.js#js/stats.js?v=${SHA_SHORT}#" index.html
          sed -i "s#js/chat.js#js/chat.js?v=${SHA_SHORT}#" index.html
          sed -i "s#js/app.js#js/app.js?v=${SHA_SHORT}#" index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
